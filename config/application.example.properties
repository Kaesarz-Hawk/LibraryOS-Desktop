# LibraryOS Configuration Template
# Copy this file to config/application.properties for local environment overrides

# Database Configuration
db.url=jdbc:mysql://localhost:3306/libraryos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=10000
db.pool.maxLifetime=600000

# Institution Info
institution.name=Dhaka Central Model Library
institution.name_bn=ঢাকা সেন্ট্রাল মডেল লাইব্রেরি
institution.code=DCML-01
institution.currency=৳
institution.country=Bangladesh

# File Storage
storage.base_dir=${user.home}/.libraryos/storage
storage.covers_dir=${user.home}/.libraryos/storage/covers
storage.digital_dir=${user.home}/.libraryos/storage/digital
storage.backups_dir=${user.home}/.libraryos/backups

# Security & Policies
auth.max_failed_attempts=5
auth.lockout_minutes=15
